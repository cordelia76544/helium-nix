name: Update Helium

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq python3

      - name: Update Helium package
        run: |
          ./update.sh

      - name: Build Helium package
        run: |
          nix build .#helium

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "helium: update to latest release"
          title: "Update Helium"
          body: |
            Automated update for Helium AppImage package.

            This PR updates:
            - Helium version
            - AppImage hash
          branch: "update-helium"
          delete-branch: true
